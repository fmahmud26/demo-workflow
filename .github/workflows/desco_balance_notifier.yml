name: DESCO Balance Notification

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  DESCO_ACCOUNT_NO: ""
  DESCO_METER_NO: "661120233559"
  LOW_BALANCE_THRESHOLD: "100"
  EMAIL_TO: "firozmahmud26@gmail.com"
  SMS_TO_NUMBER: "01744885126"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Balance
        id: fetch
        run: |
          set -euo pipefail

          response="$(curl --insecure --silent "https://prepaid.desco.org.bd/api/tkdes/customer/getBalance?accountNo=${DESCO_ACCOUNT_NO}&meterNo=${DESCO_METER_NO}")"
          balance=$(echo "$response" | jq -r '.data.balance')
          pretty_response=$(echo "$response" | jq .)
          checked_at=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M %p %Z')

          if (( $(echo "$balance < $LOW_BALANCE_THRESHOLD" | bc -l) )); then
            subject="⚠️ LOW BALANCE: ${balance} Tk (as of ${checked_at})"
          else
            subject="DESCO Balance: ${balance} Tk (as of ${checked_at})"
          fi

          {
            echo "balance=$balance"
            echo "checked_at=$checked_at"
            echo "subject=$subject"
            echo "response<<EOF"
            echo "$pretty_response"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: ${{ env.subject }}
          to: ${{ env.EMAIL_TO }}
          from: GitHub Actions <${{ secrets.EMAIL_USER }}>
          body: |
            Hello Firoz,

            ✅ Current Balance: **${{ env.balance }} Tk**

            🕒 Checked At: **${{ env.checked_at }}**

            📋 Full API Response:
            ```
            ${{ env.response }}
            ```

            (Automatically checked on schedule.)

      - name: Send Discord Notification
        run: |
          set -euo pipefail

          safe_response=$(echo "${{ env.response }}" | jq -Rs .)

          message="${{ env.subject }}\nBalance: ${{ env.balance }} Tk\nChecked At: ${{ env.checked_at }}\n\nFull API Response:\n\`\`\`$(echo "$safe_response" | jq -r .)\`\`\`"
          payload=$(jq -n --arg content "$message" '{content: $content}')
          curl -X POST \
               -H "Content-Type: application/json" \
               -d "$payload" \
               "${{ secrets.DISCORD_WEBHOOK }}"

      # - name: Send SMS Notification (if balance < 100)
